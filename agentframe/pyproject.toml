[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentframe"
version = "4.3.0"
description = "AgentFrame v4.3 — KV 增量持久化 + 前缀复用 + 真 INT4 (29.1x) + Couple 预取 + LFRU 滞回"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [{ name = "Cloud LTE Studio" }]
dependencies = [
    "numpy>=1.24",
    "flask>=3.0",
]

[project.optional-dependencies]
api = ["flask>=3.0"]
dev = ["pytest"]

[project.scripts]
agentframe = "agentframe.cli:main"
agentframe-api = "agentframe.api.server:main"

[tool.setuptools]
packages = ["agentframe", "agentframe.core", "agentframe.llm",
            "agentframe.embed", "agentframe.memory", "agentframe.api"]
