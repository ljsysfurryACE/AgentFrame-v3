[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentframe"
version = "4.2.0"
description = "AgentFrame v4.2 — 真 INT4 打包 (29.1x) + Couple 跨轮预取 + LFRU 滞回 + MemoryDirector"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [{ name = "Cloud LTE Studio" }]
dependencies = [
    "numpy>=1.24",
    "flask>=3.0",
]

[project.optional-dependencies]
api = ["flask>=3.0"]
dev = ["pytest"]

[project.scripts]
agentframe = "agentframe.cli:main"
agentframe-api = "agentframe.api.server:main"

[tool.setuptools]
packages = ["agentframe", "agentframe.core", "agentframe.llm",
            "agentframe.embed", "agentframe.memory", "agentframe.api"]
